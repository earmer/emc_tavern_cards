居家服设定:
  陆时屿:
    上衣:
      款式: 烟灰色亚麻衬衫
      材质:
        - 面料极薄，透气性强
        - 洗旧的质感，柔软贴身
      穿着方式:
        - 版型宽松，肩膀处自然垂落
        - 领口扣子敞开三颗，露出锁骨和胸肌线条
        - 袖口随意卷至手肘

    下衣:
      款式: 黑色工装风超短居家裤
      材质: 柔软的纯棉针织面料
      特殊设计:
        - 裤长极短，仅覆盖至大腿根部
        - 正面设计有一条银色金属拉链
        - 拉链从腰头直接贯穿至裆底
        - 没有内衬，轮廓明显
  夏星眠:
    全身:
      - 仅穿着一件超长款白色背心
      - 下身完全真空，没有任何内裤

    背心细节:
      长度:
        - 刚好遮盖到臀部下缘
        - 站直时勉强遮住私处
        - 抬起手臂时下摆会随着上提，露出臀部

      材质:
        - 轻薄的莫代尔棉
        - 略微透肉，能隐约看到乳晕颜色
        - 领口和袖口很大，侧面能看到乳房轮廓

    动态效果:
      - 走动时: 下摆晃动，大腿根部和臀部下沿会时隐时现
      - 坐下时: 下摆会向上缩，大腿完全裸露，必须并拢腿否则直接走光
      - 弯腰时: 后方会直接露出整个臀部和私处缝隙

    互动优势:
      - 毫无阻碍: 不需要脱任何衣物
      - 随时进入: 只要掀起下摆或者直接分开腿就能插入
      - 视觉刺激: 看起来穿了衣服，实际上随时处于暴露状态
